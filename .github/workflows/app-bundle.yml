name: App release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and release macOS app bundle
    if: github.ref == 'refs/heads/master'
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run tests
        run: |
          swift test
          Tests/Smoke/release_version_test.sh
          Tests/Smoke/release_workflow_test.sh

      - name: Package app
        run: Scripts/package_app.sh

      - name: Verify app bundle
        run: Tests/Smoke/app_bundle_test.sh

      - name: Create archive
        run: ditto -c -k --sequesterRsrc --keepParent AISpendBar.app AISpendBar.zip

      - name: Determine release version
        id: release
        run: |
          git fetch --force --tags origin
          existing_release="$(
            git tag --points-at "$GITHUB_SHA" --list \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | tail -n 1 \
              || true
          )"
          if [[ -n "$existing_release" ]]; then
            release_version="$existing_release"
            publish=false
          else
            release_version="$(git tag --list | Scripts/next_release_version.sh)"
            publish=true
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "$RELEASE_VERSION" AISpendBar.zip \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_VERSION" \
            --generate-notes
